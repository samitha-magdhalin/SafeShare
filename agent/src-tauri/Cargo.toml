[package]
name="safeshare-agent"
version="0.1.0"
description="SafeShare Windows Pilot Agent"
edition="2021"
[lib]
name="safeshare_agent_lib"
crate-type= ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build= {version="2",features= [] }
[dependencies]
tauri= {version="2",features= ["tray-icon"] }
tauri-plugin-notification="2"
image= {version="0.25",default-features=false,features= ["png"] }
windows= {version="0.61",features= ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging"] }
tauri-plugin-single-instance = "2"
